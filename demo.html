    if(act==='sub'){S.sub=b.dataset.sub||'';draft=null;bizMsg='';save();render();window.scrollTo(0,0);return}
    if(act==='toggleKid'){var k=byId(S.kids,id);if(k)k.present=!k.present}
    if(act==='delKid')S.kids=S.kids.filter(function(x){return x.id!==id});
    if(act==='pay'){var p=byId(S.kids,id);if(p){p.paid=true;p.paidDate=todayIso();S.rc=(S.rc||0)+1;p.rcpt=S.rc;save();render();showReceipt(id);return}}
    if(act==='receipt'){showReceipt(id);return}
    if(act==='toggleStaff'){var s=byId(S.staff,id);if(s){s.present=!s.present;s.abs=Math.max(0,s.abs+(s.present?-1:1))}}
    if(act==='delStaff')S.staff=S.staff.filter(function(x){return x.id!==id});
    if(act==='delExp')S.exp=S.exp.filter(function(x){return x.id!==id});
    if(act==='delDoc')S.docs=S.docs.filter(function(x){return x.id!==id});
    if(act==='openEval'){var mk=monthKey(),ev=S.evals[id+'|'+mk];draft={kid:id,r:ev?JSON.parse(JSON.stringify(ev.r)):{lang:3,soc:3,mot:3,cog:3,beh:3},note:ev&&ev.note?nm(ev.note):''}}
    if(act==='cancelEval')draft=null;
    if(act==='rate'&&draft){draft.r[b.dataset.area]=+b.dataset.val;var f=view.querySelector('#saveEval input');if(f)draft.note=f.value}
    save();render();
  });
  view.addEventListener('change',function(e){
    if(e.target.id==='busck'){e.target.closest('form').classList.toggle('hasbus',e.target.checked)}
  });
  view.addEventListener('submit',function(e){
    e.preventDefault();keep=false;var f=e.target,d=function(n){return f.elements[n]?f.elements[n].value.trim():''};
    if(f.id==='addKid'){
      var bus=f.elements.bus.checked;
      S.kids.push({id:S.ids.kid++,name:d('name'),cls:d('cls'),parent:d('parent'),phone:d('phone'),area:d('area'),pickup:d('pickup'),fee:num(d('fee')),bus:bus,busFee:bus?num(d('busFee')):0,paid:false,paidDate:'',rcpt:0,present:true,joined:todayIso()});
    }
    if(f.id==='addStaff')S.staff.push({id:S.ids.staff++,name:d('name'),role:d('role'),end:d('end'),present:true,abs:0});
    if(f.id==='addExp')S.exp.push({id:S.ids.exp++,date:todayIso(),cat:d('cat'),note:d('note'),amount:num(d('amount'))});
    if(f.id==='addDoc')S.docs.push({id:S.ids.doc++,title:d('title'),expires:d('expires')});
    if(f.id==='saveBiz'){
      var trn=d('trn').replace(/\D/g,'');
      if(trn.length!==15){bizMsg='err';keep=true;render();return}
      S.biz={nameAr:d('nameAr')||S.biz.nameAr,nameEn:d('nameEn')||S.biz.nameEn,trn:trn,addrAr:d('addrAr'),addrEn:d('addrEn'),phone:d('phone'),vatTuition:(f.elements.vatTuition.value==='ex'?'ex':+f.elements.vatTuition.value),vatBus:(f.elements.vatBus.value==='ex'?'ex':+f.elements.vatBus.value)};
      bizMsg='ok';
    }
    if(f.id==='saveEval'&&draft){S.evals[draft.kid+'|'+monthKey()]={r:draft.r,note:d('note')};draft=null}
    save();render();
  });
  window.__demo={invLines:invLines,drawInv:drawInv,buildInvoice:buildInvoice,S:function(){return S}};
  render();
})();
</script>
</body>
</html>
